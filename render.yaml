services:
  - type: web
    name: ego-discord-bot
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    autoDeploy: true
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ENVIRONMENT
        value: production
      - key: PORT
        value: "10000"
      - key: LOG_LEVEL
        value: INFO
